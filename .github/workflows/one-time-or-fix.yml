name: one-time observatorio fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply interaction fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='OR_VOTE_FIX_V1'
          if marker not in s:
            s=s.replace("const storage='observatorio-real-points';", "const storage='observatorio-real-points'; const voteStorage='observatorio-real-user-votes'; const OR_VOTE_FIX_V1=true;")
            old="document.getElementById('dashboard-vote')?.addEventListener('click',()=>{ const ps=points(); ids.forEach(id=>{const p=ps.find(x=>x.id===id);if(p)p.votes=Number(p.votes||0)+1}); localStorage.setItem(storage,JSON.stringify(ps)); update(); const el=document.getElementById('popup-votes'); if(el)el.textContent=fmt(ps.filter(p=>ids.includes(p.id)).reduce((n,p)=>n+Number(p.votes||0),0)); });"
            new="""document.getElementById('dashboard-vote')?.addEventListener('click',()=>{ const key=ids.slice().sort().join('|'); const voted=JSON.parse(localStorage.getItem(voteStorage)||'{}'); const btn=document.getElementById('dashboard-vote'); if(voted[key]){btn?.classList.add('vote-voted'); return;} const ps=points(); const target=ps.find(x=>x.id===ids[0]); if(target){target.votes=Number(target.votes||0)+1;localStorage.setItem(storage,JSON.stringify(ps));voted[key]=true;localStorage.setItem(voteStorage,JSON.stringify(voted));btn?.classList.add('vote-voted');update(); const el=document.getElementById('popup-votes'); if(el)el.textContent=fmt(ps.reduce((n,p)=>n+Number(p.votes||0),0));}}); const voteKey=ids.slice().sort().join('|'); const voteState=JSON.parse(localStorage.getItem(voteStorage)||'{}'); if(voteState[voteKey])document.getElementById('dashboard-vote')?.classList.add('vote-voted');"""
            s=s.replace(old,new)
            s=s.replace("const target=group[0]; popup.remove(); if(target?.id) openExistingPoint(target.id); else document.querySelector('#mapa')?.scrollIntoView({behavior:'smooth'});", "const target=group[0]; popup.remove(); if(target?.id) openExistingPoint(target.id,true); else document.querySelector('#mapa')?.scrollIntoView({behavior:'smooth'});")
            p.write_text(s)
          q=Path('app.js'); a=q.read_text()
          if 'OR_CONTRIBUTE_FIX_V1' not in a:
            a=a.replace('function openExistingPoint(id){', 'function openExistingPoint(id,contribute=false){')
            a=a.replace("addressEl.textContent=p.address||\"Dirección no disponible\";placeEl.textContent=p.place||\"\"},350)}", "addressEl.textContent=p.address||\"Dirección no disponible\";placeEl.textContent=p.place||\"\";if(contribute)setTimeout(openContribution,120)},350)}\nconst OR_CONTRIBUTE_FIX_V1=true;")
            q.write_text(a)
          css=Path('style.css'); c=css.read_text()
          if 'OR_VOTE_STYLE_V1' not in c:
            c+='\n/* OR_VOTE_STYLE_V1 */\n.popup-vote{background:#fff!important;color:#b84a4a!important;border-color:#e0b0b0!important}.popup-vote.vote-voted{background:#36a36b!important;color:#fff!important;border-color:#36a36b!important}\n'
            css.write_text(c)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js style.css
          git diff --cached --quiet || git commit -m "Fix voting state and alert data contribution"
          git push
