<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Observatorio Real — NAZER</title>
<link href="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><span class="cloud">☁</span><span>Observatorio Real</span></a>
  <span class="status"><i></i>Mapa activo</span>
</header>
<main>
  <section class="map-shell">
    <div class="map-toolbar">
      <div>
        <span class="eyebrow">NAZER · MAPA REAL</span>
        <h1>Observá el territorio</h1>
      </div>
      <div class="toolbar-actions"><button id="locate" class="tool-button secondary-tool" type="button">Usar mi ubicación</button></div>
    </div>
    <div id="map" aria-label="Mapa interactivo"></div>
    <div class="map-help">Tocá el mapa para marcar un punto. Arrastrá para mover · pellizcá para zoom · incliná con dos dedos.</div>
    <div id="point-card" class="point-card hidden">
      <div><strong>Punto seleccionado</strong><button id="clear-point" type="button">×</button></div>
      <span id="coords"></span>
      <button id="save-point" class="save-button" type="button">Guardar punto</button>
    </div>
  </section>
</main>
<footer>Observatorio Real · datos reales, trazables y abiertos</footer>
<script src="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.js"></script>
<script src="./app.js"></script>
</body>
</html>
